---
# MySQL Primary Service and Deployment
apiVersion: v1
kind: Service
metadata:
    name: mysql-primary
spec:
    ports:
        - port: 3306
    selector:
        app: mysql-primary
---
apiVersion: apps/v1
kind: Deployment
metadata:
    name: mysql-primary
spec:
    replicas: 1
    selector:
        matchLabels:
            app: mysql-primary
    template:
        metadata:
            labels:
                app: mysql-primary
        spec:
            containers:
                - name: mysql-primary
                  image: mysql:9
                  env:
                      - name: MYSQL_ROOT_PASSWORD
                        value: password
                      - name: MYSQL_DATABASE
                        value: instagram_db
                      - name: MYSQL_USER
                        value: repl_user
                      - name: MYSQL_PASSWORD
                        value: password
                  args:
                      - '--server-id=1'
                      - '--log-bin=mysql-bin'
                      - '--gtid-mode=ON'
                      - '--enforce-gtid-consistency=ON'
                  ports:
                      - containerPort: 3306
                  volumeMounts:
                      - name: mysql-primary-storage
                        mountPath: /var/lib/mysql
                      - name: init-scripts-volume
                        mountPath: /docker-entrypoint-initdb.d/init-primary.sql
                        subPath: init-primary.sql
            volumes:
                - name: mysql-primary-storage
                  persistentVolumeClaim:
                      claimName: mysql-primary-pvc
                - name: init-scripts-volume
                  configMap:
                      name: mysql-init-scripts
---
# MySQL Replica Service and Deployment
apiVersion: v1
kind: Service
metadata:
    name: mysql-replica
spec:
    ports:
        - port: 3306
    selector:
        app: mysql-replica
---
apiVersion: apps/v1
kind: Deployment
metadata:
    name: mysql-replica
spec:
    replicas: 1
    selector:
        matchLabels:
            app: mysql-replica
    template:
        metadata:
            labels:
                app: mysql-replica
        spec:
            containers:
                - name: mysql-replica
                  image: mysql:9
                  env:
                      - name: MYSQL_ROOT_PASSWORD
                        value: password
                  args:
                      - '--server-id=2'
                      - '--relay-log=mysql-relay-bin'
                      - '--read-only=1'
                      - '--gtid-mode=ON'
                      - '--enforce-gtid-consistency=ON'
                  ports:
                      - containerPort: 3306
                  volumeMounts:
                      - name: mysql-replica-storage
                        mountPath: /var/lib/mysql
                      - name: init-scripts-volume
                        mountPath: /docker-entrypoint-initdb.d/init-replica.sh
                        subPath: init-replica.sh
            volumes:
                - name: mysql-replica-storage
                  persistentVolumeClaim:
                      claimName: mysql-replica-pvc
                - name: init-scripts-volume
                  configMap:
                      name: mysql-init-scripts
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: laravel-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: laravel-app
  template:
    metadata:
      labels:
        app: laravel-app
    spec:
      containers:
        # 1. PHP-FPM Application Container
        - name: app
          image: instagram-app:local
          imagePullPolicy: Never
          lifecycle:
            postStart:
              exec:
                command: ["sh", "-c", "cp -a /var/www/html/. /shared-workspace/"]
          ports:
            - containerPort: 9000
          envFrom:
            - configMapRef:
                name: laravel-config
          volumeMounts:
            - name: code-sharing-volume
              mountPath: /shared-workspace

        # 2. Laravel Reverb WebSocket Container (NEW)
        - name: reverb
          image: instagram-app:local
          imagePullPolicy: Never
          command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8090", "--debug"]
          ports:
            - containerPort: 8090
          envFrom:
            - configMapRef:
                name: laravel-config

        # 3. Nginx Web Server Container
        - name: web
          image: nginx:latest
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-config-volume
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            - name: code-sharing-volume
              mountPath: /var/www/html
      volumes:
        - name: nginx-config-volume
          configMap:
            name: nginx-config
        - name: code-sharing-volume
          emptyDir: {}
