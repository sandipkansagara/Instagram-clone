version: '3.8'

services:
  # Your PHP-FPM Application
  app:
    build: .
    container_name: instagram-app
    depends_on:
      - redis
    networks:
      - laravel-net
    ports:
      - "8090:8090"
    volumes:
      - .:/var/www/html # Mounts your local code into the container

  # The Nginx Web Server
  web:
    image: nginx:latest
    container_name: instagram-web
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./.docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - laravel-net
  redis: # This name MUST match your REDIS_HOST in .env
    image: redis:alpine
    ports:
      - "6379:6379"
    networks:
      - laravel-net

  frontend:
    image: node:20-alpine
    container_name: instagram-frontend
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - /var/www/html/node_modules
    ports:
      - "5173:5173"
    environment:
      - WATCHPACK_POLLING=true # Forces Vite to watch for file changes in Docker
    command: sh -c "npm install && npm run dev"

networks:
  laravel-net:
    driver: bridge
