version: '3.8'

services:
  app:
    build: .
    container_name: instagram-app
    depends_on:
      - redis
    networks:
      - laravel-net
    ports:
      - "8090:8090" # For Reverb WebSockets
    volumes:
      - .:/var/www/html

  web:
    image: nginx:latest
    container_name: instagram-web
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./.docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - laravel-net

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    networks:
      - laravel-net

  frontend:
    image: node:20-alpine
    container_name: instagram-frontend
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - /var/www/html/node_modules
    ports:
      - "5173:5173"
    environment:
      - WATCHPACK_POLLING=true
    command: sh -c "npm install && npm run dev"
    networks: # Added network configuration so it matches others
      - laravel-net

  mysql-primary:
    image: mysql:9
    container_name: mysql-primary
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: instagram_db
      MYSQL_USER: repl_user
      MYSQL_PASSWORD: password
    ports:
      - "3356:3306"
    volumes:
      - primary_data:/var/lib/mysql
      - ./mysql_cluster/init-primary.sql:/docker-entrypoint-initdb.d/init-primary.sql
    networks:
      - laravel-net
    command:
      - --server-id=1
      - --log-bin=mysql-bin
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON

  mysql-replica:
    image: mysql:9
    container_name: mysql-replica
    environment:
      MYSQL_ROOT_PASSWORD: password
    ports:
      - "3307:3306"
    depends_on:
      - mysql-primary
    volumes:
      - replica_data:/var/lib/mysql
      - ./mysql_cluster/init-replica.sh:/docker-entrypoint-initdb.d/init-replica.sh
    networks:
      - laravel-net
    command:
      - --server-id=2
      - --relay-log=mysql-relay-bin
      - --read-only=1
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON

volumes:
  primary_data:
  replica_data:

networks:
  laravel-net:
    driver: bridge
